# The backup-system namespace itself is created by flux/infrastructure/base,
# alongside the source secrets that have to exist before this starts.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-operator
  namespace: backup-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backup-operator
rules:
  - apiGroups: ["backup.davud.io"]
    resources: ["backups", "backuprepositories"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["backup.davud.io"]
    resources: ["backups/status"]
    verbs: ["get", "patch", "update"]
  # ownerReferences with blockOwnerDeletion need this when the
  # OwnerReferencesPermissionEnforcement admission plugin is on.
  - apiGroups: ["backup.davud.io"]
    resources: ["backups/finalizers"]
    verbs: ["update"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
  # Cluster-wide: reads the source secrets in backup-system, writes the copies
  # into each Backup's namespace, and checks that CNPG `<cluster>-app` secrets exist.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backup-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backup-operator
subjects:
  - kind: ServiceAccount
    name: backup-operator
    namespace: backup-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-operator
  namespace: backup-system
spec:
  replicas: 1                       # no leader election
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: backup-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backup-operator
    spec:
      serviceAccountName: backup-operator
      imagePullSecrets:
        - name: registry-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: registry.aquilla.dev/davud/backup-operator   # tag: kustomization.yaml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: tmp
          emptyDir: {}
