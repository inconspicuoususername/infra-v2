---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: tailscale
  namespace: tailscale
spec:
  interval: 24h
  url: https://pkgs.tailscale.com/helmcharts
---
# Tailscale operator: puts selected Services on the tailnet (see
# ../configs/tailnet-proxygroup.yaml). OAuth credentials come from the
# operator-oauth secret in ../base, which the chart mounts by name.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 1h
  chart:
    spec:
      chart: tailscale-operator
      version: "1.102.4"
      sourceRef:
        kind: HelmRepository
        name: tailscale
  values:
    # The OAuth client is tagged tag:k8-cluster, so that is the only tag it
    # can hand out without extra tagOwners entries.
    operatorConfig:
      defaultTags:
        - "tag:k8-cluster"
      resources:
        requests: { cpu: 20m, memory: 64Mi }
        limits: { memory: 256Mi }
    proxyConfig:
      defaultTags: "tag:k8-cluster"
