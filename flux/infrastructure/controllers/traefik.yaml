---
# Chart source, colocated so this file owns traefik's source + release.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 24h
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: "41.3.0"
      sourceRef:
        kind: HelmRepository
        name: traefik           # same namespace, so sourceRef.namespace is omitted
  values:
    # MetalLB (L2) fronts the cluster: the Service is type LoadBalancer and MetalLB
    # hands it the pinned VIP below. One replica is plenty for a single node.
    deployment:
      replicas: 1
    service:
      type: LoadBalancer
      annotations:
        # Pin the VIP so DNS stays stable
        metallb.io/loadBalancerIPs: 10.24.1.251
      spec:
        # Announce the VIP only from the node actually running a Traefik pod. By default
        # the external policy is Cluster, which means MetalLB can assign the VIP to other
        # nodes on the netwrk
        externalTrafficPolicy: Local
    ports:
      web:
        asDefault: true
        port: 8000
        # redirect http -> https (chart v34+ moved this under http.redirections)
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
      websecure:
        asDefault: true
        port: 8443
        http:
          tls:
            enabled: true
      # Custom TCP entrypoint for Perforce. Referenced by the IngressRouteTCP
      # in apps/base/perforce, which terminates TLS here. Tailnet-only: not on
      # the public Service, reached as port 1666 of the apps tier
      # (../configs/tailnet-services.yaml).
      p4d:
        port: 1666
        expose:
          default: false
        protocol: TCP
      # Tailnet-only entrypoints, one per access tier (apps: plane, authentik,
      # perforce; admin: registry, renovate). Not on the public Service: each
      # is fronted by its own `loadBalancerClass: tailscale` Service in
      # ../configs/tailnet-services.yaml, so the tailnet policy can grant the
      # tiers separately. Services sharing a tier can reach each other's
      # routes by Host header; that is the tier boundary, by design.
      ts-apps:
        port: 8501
        expose:
          default: false
        protocol: TCP
        http:
          tls:
            enabled: true
      ts-admin:
        port: 8502
        expose:
          default: false
        protocol: TCP
        http:
          tls:
            enabled: true
    # Let cert-manager issue certs (via IngressRoute tls secretName); we don't
    # use Traefik's built-in ACME here.
    providers:
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: true
      kubernetesIngress:
        enabled: true        # needed so cert-manager HTTP-01 solver Ingress works
