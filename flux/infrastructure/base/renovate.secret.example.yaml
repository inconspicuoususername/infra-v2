# Template for renovate.secret.yaml (SOPS-encrypted, git-committed).
# Populate the real values, save as renovate.secret.yaml, then:
#   sops -e -i renovate.secret.yaml
#
# Lives in the base layer because the renovate-operator HelmRelease mounts
# CLIENT_SECRET at install time via a non-optional secretKeyRef. infra-base
# reconciles (and decrypts) before infra-controllers, which has `wait: true` —
# put this any higher and a missing secret wedges every Kustomization below it.
---
apiVersion: v1
kind: Secret
metadata:
  name: renovate-secret
  namespace: renovate
type: Opaque
stringData:
  # authentik OIDC provider for the operator's web UI. Must match the
  # `clientId` in renovate.yaml's HelmRelease values.
  CLIENT_SECRET: "REPLACE_ME"
  GH_CLIENT_ID: "REPLACE_ME"
  # GitHub App that opens the PRs — Settings → Developer settings → GitHub Apps.
  # App ID and Installation ID are integers; the PEM is the full private key
  # file including the BEGIN/END lines.
  GH_APP_ID: "REPLACE_ME"
  GH_INSTALL_ID: "REPLACE_ME"
  GH_PKEY: |
    -----BEGIN RSA PRIVATE KEY-----
    REPLACE_ME
    -----END RSA PRIVATE KEY-----
