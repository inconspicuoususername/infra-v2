---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: plane
  namespace: plane
spec:
  interval: 24h
  url: https://helm.plane.so/
---
# Plane Commercial Edition on the free plan (closed source, registers with
# prime.plane.so). Migrated from plane-ce 1.8.4 / v1.4.2 on 2026-10-21; the
# chart name change makes Flux uninstall + reinstall, and the StatefulSet PVCs
# (same names in both charts) carry over.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plane
  namespace: plane
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: plane-enterprise
      version: "3.10.12"
      sourceRef:
        kind: HelmRepository
        name: plane
  install:
    remediation:
      retries: 3
  valuesFrom:
    - kind: Secret
      name: plane-db-app                 # CNPG-generated
      valuesKey: uri
      targetPath: env.pgdb_remote_url
    - kind: Secret
      name: plane-secret
      valuesKey: MINIO_ROOT_PASSWORD
      targetPath: services.minio.root_password
    - kind: Secret
      name: plane-secret
      valuesKey: RABBITMQ_PASSWORD
      targetPath: services.rabbitmq.default_password
  values:
    planeVersion: v3.3.3

    license:
      licenseDomain: plane.davud.io      # also the IngressRoute host

    ingress:
      enabled: true
      ingressClass: traefik
      traefik:
        entryPoints: [ts-apps]           # tailnet-only (apps tier)
    ssl:
      tls_secret_name: plane-tls         # from certificate.yaml

    external_secrets:
      app_keys_existingSecret: plane-app-keys

    env:
      requireExplicitSecrets: true       # never fall back to the chart's public example keys
      storageClass: openebs-hostpath

    services:
      postgres:
        local_setup: false               # CNPG instead, see postgres.yaml
      minio:
        volumeSize: 10Gi
