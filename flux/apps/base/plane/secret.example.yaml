# Copy each document to its file, fill in, then:  sops --encrypt --in-place <file>
# This example stays plaintext as documentation and is NOT applied.
---
# secret.yaml -- consumed via the HelmRelease's valuesFrom.
apiVersion: v1
kind: Secret
metadata:
  name: plane-secret
  namespace: plane
type: Opaque
stringData:
  MINIO_ROOT_PASSWORD: "REPLACE_ME"        # openssl rand -hex 24
  RABBITMQ_PASSWORD: "REPLACE_ME"          # openssl rand -hex 24
---
# app-keys.secret.yaml -- the chart's external_secrets.app_keys_existingSecret.
# SECRET_KEY and the AES key encrypt data in the DB: never rotate them.
apiVersion: v1
kind: Secret
metadata:
  name: plane-app-keys
  namespace: plane
type: Opaque
stringData:
  SECRET_KEY: "REPLACE_ME"                 # openssl rand -hex 32
  LIVE_SERVER_SECRET_KEY: "REPLACE_ME"     # openssl rand -hex 32
  AES_SECRET_KEY: "REPLACE_ME"             # openssl rand -hex 32
  SILO_HMAC_SECRET_KEY: "REPLACE_ME"       # openssl rand -hex 32
