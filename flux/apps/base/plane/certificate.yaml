apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: plane-tls
  namespace: plane
spec:
  secretName: plane-tls # referenced by the chart's IngressRoute
  issuerRef:
    name: letsencrypt-dns          # tailnet-only host, HTTP-01 can't reach it
    kind: ClusterIssuer
  dnsNames:
    - plane.davud.io
