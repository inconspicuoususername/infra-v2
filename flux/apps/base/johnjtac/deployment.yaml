---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: johnjtac
  namespace: johnjtac
spec:
  replicas: 1
  strategy:
    type: Recreate            # single RWO runtime PVC — no two pods at once
  selector:
    matchLabels:
      app: johnjtac
  template:
    metadata:
      labels:
        app: johnjtac
    spec:
      imagePullSecrets:
        - name: registry-pull
      containers:
        - name: johnjtac
          image: registry.aquilla.dev/davud/johnjtac:0.0.32
          env:
            # DATABASE_URL straight from the CNPG-generated app secret.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: jtac-db-app
                  key: uri
            - name: GROK_SYSTEM_PROMPT_FILE
              value: /app/sysprompt.txt
          envFrom:
            # Discord + xAI tokens and Grok config, carried from server1 .env.
            - secretRef:
                name: johnjtac-secret
          volumeMounts:
            - name: runtime
              mountPath: /app/runtime
            - name: logs
              mountPath: /app/logs
            - name: sysprompt
              mountPath: /app/sysprompt.txt
              subPath: sysprompt.txt
              readOnly: true
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: runtime
          persistentVolumeClaim:
            claimName: johnjtac-runtime
        - name: logs
          emptyDir: {}
        - name: sysprompt
          secret:
            secretName: johnjtac-sysprompt   # NOT in git — apply out-of-band
