---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: johnjtac
  namespace: johnjtac
spec:
  replicas: 1
  strategy:
    type: Recreate            # single RWO runtime PVC — no two pods at once
  selector:
    matchLabels:
      app: johnjtac
  template:
    metadata:
      labels:
        app: johnjtac
    spec:
      imagePullSecrets:
        - name: registry-pull
      # Image has no USER (runs as root); run as node:1000 from the node base
      # image. fsGroup makes the root-owned runtime PVC group-writable.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: johnjtac
          image: registry.aquilla.dev/davud/johnjtac:0.0.34
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            # DATABASE_URL straight from the CNPG-generated app secret.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: jtac-db-app
                  key: uri
            - name: GROK_SYSTEM_PROMPT_FILE
              value: /app/sysprompt.txt
            # Image sets PNPM_HOME=/pnpm (root-owned); pnpm writes its
            # package-manager env there at start, so point it somewhere node owns.
            - name: PNPM_HOME
              value: /home/node/.pnpm
          envFrom:
            # Discord + xAI tokens and Grok config, carried from server1 .env.
            - secretRef:
                name: johnjtac-secret
          volumeMounts:
            - name: runtime
              mountPath: /app/runtime
            - name: logs
              mountPath: /app/logs
            - name: sysprompt
              mountPath: /app/sysprompt.txt
              subPath: sysprompt.txt
              readOnly: true
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: runtime
          persistentVolumeClaim:
            claimName: johnjtac-runtime
        - name: logs
          emptyDir: {}
        - name: sysprompt
          secret:
            secretName: johnjtac-sysprompt   # NOT in git — apply out-of-band
