apiVersion: v1
kind: Namespace
metadata:
  name: registry
  labels:
    # warn/audit only: current pods don't meet restricted yet; switch to enforce once they do.
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
  annotations:
    # Never garbage-collected by Flux: deleting a namespace cascades into PVCs
    # and secrets. Tearing down the app must not take its data with it.
    kustomize.toolkit.fluxcd.io/prune: disabled
