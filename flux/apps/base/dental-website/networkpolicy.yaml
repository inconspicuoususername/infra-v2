---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dental-website-db-ingress
  namespace: dental-website
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: dental-website-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
