---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dental-website
  namespace: dental-website
spec:
  interval: 30m
  chart:
    spec:
      chart: ./flux/charts/website
      reconcileStrategy: Revision   # rebuild on every git change, not only on Chart.yaml version bumps
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    image: registry.aquilla.dev/aquilla/dental-website:0.0.20
    port: 3000
    runAsUser: 1000
    hosts: [chronos.aquilla.dev]
    database:
      enabled: true
      name: chronos
      owner: chronos
    env:
      # NextAuth v5 sits behind Traefik TLS termination; trust the proxy
      # host and give it the public URL for OIDC redirects.
      AUTH_URL: https://chronos.aquilla.dev
      AUTH_TRUST_HOST: "true"
    envFromSecrets:
      - dental-website-auth
