# CloudNativePG Postgres for dignita-crm. Restored (pg_dump -> pg_restore) from
# the old plain postgres:17.5 into CNPG's default major. The app reads
# DATABASE_URL from the generated "dignita-crm-db-app" secret.
#
# MOTHBALL: hibernated (pods stopped, PVCs kept) and prune-disabled, because a
# pruned Cluster deletes its own PVCs. To wake: drop the hibernation annotation.
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: dignita-crm-db
  namespace: dignita-crm
  annotations:
    cnpg.io/hibernation: "on"
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 1
  storage:
    size: 2Gi
    storageClass: openebs-hostpath
  bootstrap:
    initdb:
      database: mydatabase
      owner: myuser
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dignita-crm-db-ingress
  namespace: dignita-crm
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: dignita-crm-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
---
# Pre-CNPG data (plain postgres:17.5, owned by uid 999). Kept as a fallback
# until dignita-crm has run against dignita-crm-db after a wake; then delete
# this and the PVC by hand.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dignita-postgres
  namespace: dignita-crm
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 2Gi
