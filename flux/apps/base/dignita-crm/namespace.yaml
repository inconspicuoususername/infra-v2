apiVersion: v1
kind: Namespace
metadata:
  name: dignita-crm
  labels:
    # warn/audit only: mothballed and untested under PSA (sage-ai's milvus needs
    # Unconfined seccomp; dignita's postgres entrypoint needs root). Revisit on wake.
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
  annotations:
    # Never garbage-collected by Flux. This is a MOTHBALL: after the data is
    # seeded, dignita-crm is removed from apps/production/kustomization.yaml so
    # Flux prunes the workloads — but this namespace and the postgres PVC
    # (both prune: disabled) survive, so re-adding the entry wakes it on the
    # old data. No ingress/cert here; add those + crm.dignita.ba DNS on wake.
    kustomize.toolkit.fluxcd.io/prune: disabled
