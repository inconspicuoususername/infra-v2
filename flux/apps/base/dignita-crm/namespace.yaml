apiVersion: v1
kind: Namespace
metadata:
  name: dignita-crm
  labels:
    # warn/audit only: the app image's runtime user is unverified (mothballed,
    # never run under PSA). The CNPG db already meets restricted. Revisit on wake.
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
  annotations:
    # Never garbage-collected by Flux. This is a MOTHBALL: after the data is
    # seeded, dignita-crm is removed from apps/production/kustomization.yaml so
    # Flux prunes the workloads — but this namespace and the hibernated CNPG
    # cluster dignita-crm-db (both prune: disabled) survive. To wake: re-add the
    # entry AND drop the cnpg.io/hibernation annotation in postgres.yaml.
    # No ingress/cert here; add those + crm.dignita.ba DNS on wake.
    kustomize.toolkit.fluxcd.io/prune: disabled
