---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: authentik-tls
  namespace: authentik
spec:
  secretName: authentik-tls            # referenced by the IngressRoute
  issuerRef:
    name: letsencrypt-dns          # tailnet-only host, HTTP-01 can't reach it
    kind: ClusterIssuer
  dnsNames:
    - auth.davud.io
