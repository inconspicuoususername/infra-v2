# Why this exists: the p4 client (OpenSSL) deadlocks against Traefik's TLS 1.3.
# In TLS 1.3 the session ticket is a POST-handshake message; the p4 client waits
# to read it before sending its first RPC, but Go's crypto/tls (Traefik) won't
# flush the ticket until it has app data to write — and p4d speaks second, so it
# never does. Both sides wait -> hang. (OpenSSL terminators like the old nginx
# flush the ticket immediately, which is why TLS 1.3 worked there.)
# Disabling session tickets removes the post-handshake message entirely, so the
# client proceeds. Keeps TLS 1.3. Scoped to the p4d entrypoint only.
---
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: p4d
  namespace: perforce
spec:
  disableSessionTickets: true
