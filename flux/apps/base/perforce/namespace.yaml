apiVersion: v1
kind: Namespace
metadata:
  name: perforce
  labels:
    # p4d's entrypoint needs root + SETUID/SETGID (chown, gosu drop to perforce),
    # so restricted is out of reach without changing the image; baseline holds.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
  annotations:
    # Never garbage-collected by Flux: deleting a namespace cascades into PVCs
    # and secrets. Tearing down the app must not take its data with it.
    kustomize.toolkit.fluxcd.io/prune: disabled
