---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: abrabus
  namespace: abrabus
spec:
  interval: 30m
  chart:
    spec:
      chart: ./flux/charts/website
      reconcileStrategy: Revision   # rebuild on every git change, not only on Chart.yaml version bumps
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    image: registry.aquilla.dev/aquilla/abrabus:0.0.7
    port: 6011
    hosts: [abrabus.aquilla.dev]
