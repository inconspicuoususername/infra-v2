---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: portfolio
  namespace: portfolio
spec:
  interval: 30m
  chart:
    spec:
      chart: ./flux/charts/website
      reconcileStrategy: Revision   # rebuild on every git change, not only on Chart.yaml version bumps
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    image: registry.aquilla.dev/davud/portfolio:0.0.27
    port: 3000
    hosts: [davud.io, www.davud.io]
    database:
      enabled: true
      name: portfolio
      owner: myuser
    persistence:
      assets: { mountPath: /app/assets, size: 2Gi }   # user uploads
    env:
      NEXT_PUBLIC_SITE_URL: https://davud.io
      NEXTAUTH_URL: https://davud.io
      AUTH_TRUST_HOST: "true"
      GITHUB_CLIENT_ID: Ov23liL0pEUDVhxEPBDh
    envFromSecrets:
      - portfolio-secret   # NEXTAUTH_SECRET + GITHUB_CLIENT_SECRET + ADMIN_ALLOWLIST
