---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aquilla-website
  namespace: aquilla-website
spec:
  interval: 30m
  chart:
    spec:
      chart: ./flux/charts/website
      reconcileStrategy: Revision   # rebuild on every git change, not only on Chart.yaml version bumps
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    image: registry.aquilla.dev/aquilla/aquilla-website:0.0.44
    port: 6011
    hosts: [aquilla.dev, www.aquilla.dev]
    envFromSecrets:
      - aquilla-website-smtp   # SMTP_* for the contact form, via Purelymail
