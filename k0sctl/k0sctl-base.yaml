apiVersion: k0sctl.k0sproject.io/v1beta1
kind: Cluster
metadata:
  name: davud
spec:
  hosts:
    - role: single    
      ssh:
        address: server.something.something
        user: root
        keyPath: ~/.ssh/sshkey123
  k0s:
    version: v1.36.2+k0s.0
    dynamicConfig: false
    config:
      apiVersion: k0s.k0sproject.io/v1beta1
      kind: ClusterConfig
      metadata:
        name: k0s
      spec:
        network:
          provider: kuberouter        # k0s default CNI — DNS/kube-proxy included
          podCIDR: 10.244.0.0/16
          serviceCIDR: 10.96.0.0/12
        extensions:
          storage:
            type: external_storage
        telemetry:
          enabled: false
        workerProfiles:
          - name: relaxed-disk
            values:
              evictionHard:
                memory.available: "100Mi"
                nodefs.available: "10%"
                imagefs.available: "10%"
                nodefs.inodesFree: "5%"
                imagefs.inodesFree: "5%"
